name: Flugger
targets:
  Flugger:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Flugger
        excludes:
          - Design/AppIconMaster.png
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fluttervibe.Flugger
      PRODUCT_NAME: Flugger
      INFOPLIST_FILE: Sources/Flugger/Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      ENABLE_STRICT_CONCURRENCY: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    entitlements:
      path: Sources/Flugger/Flugger.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected-read-write: true
    scheme:
      testTargets:
        - FluggerTests
      run:
        config: Debug
      archive:
        config: Release
      profile:
        config: Release
      analyze:
        config: Debug
  FluggerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/FluggerTests
    dependencies:
      - target: Flugger
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      ENABLE_STRICT_CONCURRENCY: "YES"
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
